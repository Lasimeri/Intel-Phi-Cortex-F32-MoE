[package]
name = "cortex-tui"
version = "0.1.0"
edition = "2021"
description = "The Intel Phi Cortex's harness: a chat on the card's live weights while it trains, the live run's numbers beside it, the coach steered from the same screen, the turns framed by a Jinja template"

[[bin]]
name = "cortex-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
minijinja = "2"

[profile.release]
opt-level = 2
debug = false
